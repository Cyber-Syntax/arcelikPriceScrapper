[http]
concurrency = 2
delay_min = 0.5
delay_max = 1.5
timeout = 20
retries = 4
max_pages = 200

[output]
format = "json"                  # json | excel | csv | both (json her zaman)
dir = "out"
warranty_category = "Ek Garanti"
with_scraped_at = false          # ana products 11 sutun kalsin; opt-in 12. sutun

[categories]
include_children = true # secili dugumun alt kategorileri de taransin mi
# Agac-duyarli: "bilgisayar" yazinca Laptop/Tablet/Masaustu de kapsam disi kalir.
exclude = [
  "tablet",
  "cep-telefonu",
  "bilgisayar",
  "laptop",
  "kulaklik",
  "akilli-saat",
]

[categories.aliases]
# Bayios'ta eski ad varsa burada esle; bos birakilirsa site adi yazilir.
# "Kurutma Makinesi" = "Kurutma"

