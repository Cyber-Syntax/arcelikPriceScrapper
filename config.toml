[cache]
explicit_file = "data/explicit_products.json"
specs_file = "data/specs_cache.json"

[campaigns]
enabled = true

[warranties]
enabled = true                   # prices/all icinde; ayri komut yok

[products]
include_file = "data/product_urls.txt"
default_specs = true
default_fetch = "once"
# Tek koşuda otomatik çekilecek eksik açık ürün sayısı üst sınırı.
# Büyük listede full koşu tümünü çekmesin; --only ile daralt veya
# --refresh-explicit ile bilinçli olarak zorla.
max_auto_fetch = 50
# Istisna urunlerde ad/kategori override'i icin asagidaki gibi
# [[products.include]] blogu eklenebilir; ayni URL dosyada olsa bile
# buradaki kayit once gelir.
#
# [[products.include]]
# url = "https://www.arcelik.com.tr/10-kg-kurutma-makinesi/1001-kmx-kurutma-makinesi"
# name = "1001 KMX"
# app_category = "Kurutma Makinesi"
# force = true                 # kara listeye ragmen dahil et
