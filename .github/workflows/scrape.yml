name: scrape

on:
  schedule:
    - cron: "0 3 15 * *" # Her ayın 15'i, 03:00 Türkiye saati.
      timezone: "Europe/Istanbul"

    - cron: "0 3 1 * *" # Her ayın 1'i, 03:00 Türkiye saati.
      timezone: "Europe/Istanbul"

  workflow_dispatch:
    inputs:
      command:
        description: "Calistirilacak komut"
        type: choice
        options:
          - prices
          - all
          - specs
          - campaigns
          - list-categories
        default: prices

      only:
        description: "Tek kategori slug (bos = tum kategoriler)"
        required: false
        default: ""

      format:
        description: "Cikti formati"
        type: choice
        options:
          - json
          - excel
          - csv
          - both
        default: json

      refresh_explicit:
        description: "Explicit fiyatlari da yenile"
        type: boolean
        default: false

  issues:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: arcelik-scrape
  cancel-in-progress: false

jobs:
  scrape:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.label.name, 'scrape:')

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper
        run: pip install .

      - name: Run scraper
        id: scraper
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMAND: ${{ github.event.inputs.command }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
          INPUT_REFRESH_EXPLICIT: ${{ github.event.inputs.refresh_explicit }}
          LABEL: ${{ github.event.label.name }}

        run: |
          set -euo pipefail

          # Zamanlanmış çalıştırma:
          # Her ayın 1'i ve 15'inde prices + campaigns.
          if [ "${EVENT_NAME}" = "schedule" ]; then
            echo "Zamanlanmis scraper calistiriliyor."

            arcelikPriceScrapper prices \
              --format json \
              --out-dir out

            arcelikPriceScrapper campaigns \
              --format json \
              --out-dir out

            echo "ran=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMD="${INPUT_COMMAND:-prices}"
          FORMAT="${INPUT_FORMAT:-both}"
          ONLY="${INPUT_ONLY:-}"
          REFRESH_EXPLICIT="${INPUT_REFRESH_EXPLICIT:-false}"

          # Issue etiketiyle tetiklenirse kategori fiyatlarini cek.
          if [ -n "${LABEL:-}" ]; then
            CMD="prices"
            ONLY="${LABEL#scrape:}"
          fi

          # Slug kontrolü
          if [ -n "${ONLY}" ] && ! [[ "${ONLY}" =~ ^[a-z0-9,-]+$ ]]; then
            echo "Gecersiz slug: ${ONLY}"
            exit 1
          fi

          # Komut çalıştırma
          case "${CMD}" in
            prices|all|specs)
              ARGS=()

              if [ -n "${ONLY}" ]; then
                ARGS+=(--only "${ONLY}")
              fi

              if [ "${CMD}" = "prices" ] && [ "${REFRESH_EXPLICIT}" = "true" ]; then
                ARGS+=(--refresh-explicit)
              fi

              arcelikPriceScrapper "${CMD}" \
                "${ARGS[@]}" \
                --format "${FORMAT}" \
                --out-dir out
              ;;

            campaigns|list-categories)
              if [ -n "${ONLY}" ]; then
                echo "Uyari: ${CMD} --only kabul etmiyor; yok sayildi"
              fi

              arcelikPriceScrapper "${CMD}" \
                --format "${FORMAT}" \
                --out-dir out
              ;;

            *)
              echo "Gecersiz komut: ${CMD}"
              exit 1
              ;;
          esac

          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-output
          path: out/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success() && steps.scraper.outputs.ran == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: data-latest
          name: "Arcelik fiyat verisi"
          body: |
            Aylik veya manuel scraper ciktisi.

            Dosya adlarinda UTC tarih/saat bilgisi vardir.
            Bu Release her yeni scraper calismasinda guncellenir.

          files: out/*
          fail_on_unmatched_files: true
          overwrite_files: true
